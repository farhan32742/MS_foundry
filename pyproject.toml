[project]
name = "foundry-learning"
version = "0.1.0"
description = "An AI assistant combining resume RAG and external tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

